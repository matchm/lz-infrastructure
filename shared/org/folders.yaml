# Landing-zone folder hierarchy, owned by Crossplane (Day-0 Terraform stays
# seed-only: crossplane-admin SA + its org roles).
#
# These are direct managed resources, not an XRD: folders are few, static and
# platform-owned. XRDs are for repeated tenant-facing APIs (see XProject).
#
# Namespaced m.upbound.io variant (Crossplane v2) - all folders live in
# lz-shared so XProjects in any lz-<env> namespace can resolve them via
# folderIdRef {name, namespace: lz-shared}.
#
# deletionProtection: false while the LZ is being built/experimented with on
# kind. FLIP TO true for prod - a folder delete with projects inside is
# exactly the accident this flag exists for.
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: Folder
metadata:
  name: core
  namespace: lz-shared
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: platform
spec:
  forProvider:
    displayName: core
    parent: organizations/181428570708
    deletionProtection: false
---
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: Folder
metadata:
  name: security
  namespace: lz-shared
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: platform
spec:
  forProvider:
    displayName: security
    parent: organizations/181428570708
    deletionProtection: false
---
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: Folder
metadata:
  name: platform
  namespace: lz-shared
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: platform
spec:
  forProvider:
    displayName: platform
    parent: organizations/181428570708
    deletionProtection: false
---
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: Folder
metadata:
  name: workloads
  namespace: lz-shared
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: platform
spec:
  forProvider:
    displayName: workloads
    parent: organizations/181428570708
    deletionProtection: false
---
# Environment subfolders reference the parent Folder MR by name (parentRef) -
# no copy-pasted numeric folder IDs. Same namespace, so no namespace field
# needed on the ref.
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: Folder
metadata:
  name: workloads-prod
  namespace: lz-shared
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: platform
spec:
  forProvider:
    displayName: prod
    parentRef:
      name: workloads
    deletionProtection: false
---
apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
kind: Folder
metadata:
  name: workloads-non-prod
  namespace: lz-shared
  labels:
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/component: infra
    app.kubernetes.io/part-of: platform
spec:
  forProvider:
    displayName: non-prod
    parentRef:
      name: workloads
    deletionProtection: false
