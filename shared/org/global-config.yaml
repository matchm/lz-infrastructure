# Layer 1 (Global): Platform team owned global defaults for the entire landing zone fleet.
apiVersion: apiextensions.crossplane.io/v1beta1
kind: EnvironmentConfig
metadata:
  name: platform-global
  labels:
    platform.lzaas/layer: global
    app.kubernetes.io/name: crossplane
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: platform
data:
  organizationId: "181428570708"
  billingAccountId: "01F5C7-399448-A2BCF8"
  region: "europe-west2"

  globalLabels: |
    platform.lzaas/managed-by: crossplane
  globalTags: |
    managed-by: crossplane
    platform: lz
  tagTaxonomy: |
    environment:
      description: Deployment environment - IAM conditions and org-policy targeting.
      values: ["shrd", "plat", "dev", "stg", "prd"]
    cost-center:
      description: Billing attribution for chargeback and budget filtering.
      values: ["platform"]
    data-classification:
      description: Highest data classification the resource may hold - policy targeting.
      values: ["public", "internal", "confidential", "restricted"]
