apiVersion: platform.lzaas/v1alpha1
kind: XSharedVPC
metadata:
  name: lzaas-central-shared-vpc
spec:
  crossplane:
    compositionUpdatePolicy: Manual
    compositionRevisionSelector:
      matchLabels:
        platform.lzaas/channel: stable
  projectId: "lzaas-shd-vpc-9520"
  networkName: "lzaas-shared-vpc"
  routingMode: GLOBAL
  region: europe-west2
  enableCloudNat: true
  enableBaselineFirewall: true
  owner: mati
  env: shrd
  costCenter: platform
  dataClassification: internal
