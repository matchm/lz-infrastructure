apiVersion: platform.lzaas/v1alpha1
kind: XResourceHierarchy
metadata:
  name: lzaas-dev-hierarchy
  labels:
    # selects env-shrd EnvironmentConfig (layer 2), which now provides the
    # centralized environmentLabels/environmentTags contract values
    # (environment: shrd, cost-center, data-classification)
    platform.lzaas/env: shrd
spec:
  crossplane:
    compositionUpdatePolicy: Manual
    compositionRevisionSelector:
      matchLabels:
        platform.lzaas/channel: stable
  resourceHierarchy:
    security:
      - lzaas-secrets
  # This is the org hierarchy claim: it owns the fleet-wide TagKey/TagValue
  # taxonomy from platform-global's tagTaxonomy (exactly one claim may).
  manageTagTaxonomy: true
  defaultApis:
    - serviceusage.googleapis.com
  projectApis:
    lzaas-secrets:
      - secretmanager.googleapis.com
